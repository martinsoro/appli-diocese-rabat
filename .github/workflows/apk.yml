name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet Android
        run: |
          flutter create --platforms=android --org ma.dioceserabat --project-name appli_diocese .
          rm -f test/widget_test.dart
          sed -i 's/android:label="appli_diocese"/android:label="Diocèse de Rabat"/' android/app/src/main/AndroidManifest.xml

      - name: Dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Construire l'APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk diocese-rabat-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: diocese-rabat-demo
          path: diocese-rabat-demo.apk

      - name: Publier l'APK en téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: Démo ${{ github.run_number }}
          body: |
            APK de démonstration de l'application de l'Archidiocèse de Rabat (données fictives).
            Téléchargez diocese-rabat-demo.apk sur un téléphone Android et ouvrez-le pour l'installer.
          files: diocese-rabat-demo.apk
          make_latest: true
